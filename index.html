<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAMCHAT - Gelds</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
function openSite(shortLink, realUrl, name){
  // 1. OUVRE TA PUB - C'EST ÇA QUI TE PAIE
  window.open(shortLink, '_blank');

  // 2. OUVRE LE VRAI SITE DEDANS KAMCHAT
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal-name').innerText = name;
  document.getElementById('modal-iframe').src = realUrl;
  document.getElementById('count').innerText = "Payé ✓";
}
function closeModal(){
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal-iframe').src = '';
}
</script>
</head>
<body class="bg-gray-50">

<div class="max-w-md mx-auto p-4">
<h1 class="font-black text-green-700 text-xl">KAMCHAT</h1>
<p class="text-[10px] text-gray-400">1 clic = tu es payé + site s'ouvre dedans</p>

<div class="grid grid-cols-3 gap-3 mt-4">

<!-- LIGNE 1 -->
<button onclick="openSite('https://cuty.io/LIEN_HOTEL','https://www.booking.com/city/cm/yaounde.fr.html','Hotel')" class="bg-zinc-900 text-white rounded-2xl p-4 text-xs">🏨<br>Hotel</button>
<button onclick="openSite('https://cuty.io/LIEN_RESTO','https://glovoapp.com/cm/fr/yaounde/','Resto')" class="bg-zinc-900 text-white rounded-2xl p-4 text-xs">🍔<br>Resto</button>
<button onclick="openSite('https://cuty.io/LIEN_PHARMA','https://www.mondocteur237.com','Pharma')" class="bg-zinc-900 text-white rounded-2xl p-4 text-xs">💊<br>Pharma</button>

<!-- LIGNE 2 -->
<button onclick="openSite('https://cuty.io/LIEN_FNE','https://camerounemploi.net','FNE')" class="bg-green-600 text-white rounded-2xl p-4 text-xs">💼<br>FNE</button>
<button onclick="openSite('https://cuty.io/LIEN_WASPITO','https://www.myjob.cm','Waspito')" class="bg-green-600 text-white rounded-2xl p-4 text-xs">🩺<br>Waspito</button>
<button onclick="openSite('https://cuty.io/LIEN_EMPLOI','https://www.emploi.cm','Emploi')" class="bg-green-600 text-white rounded-2xl p-4 text-xs">💼<br>Emploi</button>

<!-- LIGNE 3 - TON NOUVEAU CAR RENTAL -->
<button onclick="openSite('https://cuty.io/LIEN_CAR','https://alicya-auto.com/fr/location-de-voitures-a-yaounde-cameroun/','Car Rental')" class="bg-yellow-400 text-black rounded-2xl p-4 text-xs font-black border-2 border-black">🚗<br>Car Rental</button>
<button onclick="openSite('https://cuty.io/LIEN_JEUX','https://www.crazygames.com','Jeux')" class="bg-yellow-400 text-black rounded-2xl p-4 text-xs font-bold">🎮<br>Jeux</button>
<button onclick="openSite('https://cuty.io/LIEN_TECH','https://allo-voisin.com','Tech')" class="bg-yellow-400 text-black rounded-2xl p-4 text-xs font-bold">🔧<br>Tech</button>

</div>

<div class="mt-8 bg-white rounded-xl p-3 text-center text-[10px] text-gray-400">
Tes pubs AdSense ici - 2e revenu
</div>
</div>

<!-- FENETRE DEDANS KAMCHAT -->
<div id="modal" class="hidden fixed inset-0 bg-black z-[999]">
<div class="bg-white w-full h-full flex flex-col">
<div class="flex justify-between items-center p-3 bg-black text-white">
<b id="modal-name">Hotel</b>
<div class="flex gap-2 items-center">
<span id="count" class="bg-green-600 px-2 py-1 rounded text-xs">Payé ✓</span>
<button onclick="closeModal()" class="bg-red-600 px-4 py-1 rounded-full">X</button>
</div>
</div>
<iframe id="modal-iframe" class="w-full flex-1 border-none" src=""></iframe>
</div>
</div>

</body>
</html>
