<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f5f5f5]">
<div class="max-w-[430px] mx-auto bg-white min-h-screen">

<div class="p-4 bg-white border-b"><span class="font-black text-[#00c853] text-xl">GELDS</span></div>

<div id="tab-chat" class="hidden p-3">
<h2 class="font-black">💬 Messagerie</h2>
<div id="msgs" class="h-[400px] overflow-y-auto border rounded-xl p-3 space-y-2 bg-gray-50 mt-3"></div>
<div class="flex gap-2 mt-2"><input id="inp" class="flex-1 border rounded-full px-4 py-2 text-sm" placeholder="Message..."><button onclick="send()" class="bg-[#00c853] text-white px-4 py-2 rounded-full font-bold">OK</button></div>
<button onclick="showTab('home')" class="text-xs text-gray-400 underline mt-4">← Retour</button>
</div>

<div id="tab-moments" class="hidden p-3">
<h2 class="font-black">🖼️ Moments</h2>
<div class="border rounded-xl p-3 mt-3"><p class="font-bold text-sm">Alain D. 📍 Yaoundé</p><p class="text-[12px]">Bastos resto ouvert 🔥</p></div>
<button onclick="showTab('home')" class="text-xs text-gray-400 underline mt-4">← Retour</button>
</div>

<div id="tab-home">
<div class="grid grid-cols-3 gap-3 p-3" id="grid"></div>

<div class="bg-black rounded-t-[30px] p-4 mt-6 pb-10">
<p class="text-white font-bold mb-3">Vidéos Yaoundé 🔥</p>
<div class="grid grid-cols-2 gap-3">
<iframe src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1851246792913670%2F&show_text=false" class="w-full h-[280px] rounded-xl bg-zinc-900" frameborder="0" allowfullscreen></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1569449071110431%2F&show_text=false" class="w-full h-[280px] rounded-xl bg-zinc-900" frameborder="0" allowfullscreen></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1404166711249147%2F&show_text=false" class="w-full h-[280px] rounded-xl bg-zinc-900" frameborder="0" allowfullscreen></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1818182712682361%2F&show_text=false" class="w-full h-[280px] rounded-xl bg-zinc-900" frameborder="0" allowfullscreen></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Freel%2F2600188100430700%2F&show_text=false" class="w-full h-[280px] rounded-xl bg-zinc-900" frameborder="0" allowfullscreen></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Freel%2F2014627569309082%2F&show_text=false" class="w-full h-[280px] rounded-xl bg-zinc-900" frameborder="0" allowfullscreen></iframe>
</div>
</div>
</div>

<!-- SEULE PUB = CELLE QUI PAIE QUAND ON CLIQUE -->
<div id="pub" class="hidden fixed inset-0 bg-black/95 z-50 max-w-[430px] mx-auto flex-col items-center justify-center p-6 text-center">
<p class="text-white/60 text-xs">Pub ouverte dans un autre onglet - ça te paie 0.05$</p>
<p id="num" class="text-white text-7xl font-black mt-2">10</p>
<div class="bg-white rounded-2xl p-5 w-full mt-6">
<p class="font-black text-sm">Si le site ne s'ouvre pas auto :</p>
<p class="text-[11px] text-gray-500 mt-1">Clique sur "Continue" dans l'autre onglet puis reviens ici.</p>
<p id="btntxt" class="bg-gray-100 w-full py-4 rounded-xl font-bold text-gray-400 mt-4">Bouton dans 10s...</p>
<button id="go" class="hidden bg-[#00c853] text-white w-full py-4 rounded-xl font-black mt-4"></button>
<button onclick="closePub()" class="text-xs text-gray-400 mt-3 underline">Fermer</button>
</div></div>

</div>
<script>
// TES LIENS PAYANTS QUE TU M'AVAIS ENVOYE
const cats=[
{n:'Messagerie',e:'💬',type:'tab',tab:'chat'},
{n:'Moments',e:'🖼️',type:'tab',tab:'moments'},
{n:'Hotel',e:'🏨',pay:'https://shrinkme.click/kamchat-hotel-final',site:'https://www.booking.com/city/cm/yaounde.html'},
{n:'Resto',e:'🍔',pay:'https://shrinkme.click/Cpnr',site:'https://glovoapp.com/cm/fr/yaounde/'},
{n:'Pharma',e:'💊',pay:'https://srnky.com/FJi7r05baJ8',site:'https://waspito.com'},
{n:'MyJob',e:'💼',pay:'https://clksz.com/mxrfAbm',site:'https://www.myjobmag.cm'},
{n:'Emploi',e:'📋',pay:'https://clksz.com/Fme4',site:'https://www.emploi.cm'},
{n:'Car',e:'🚗',pay:'https://exe.io/8LSKy',site:'https://www.rentalcars.com/en/city/cm/yaounde/'},
{n:'Jeux',e:'🎮',pay:'https://clksz.com/5FLBwBQXy5',site:'https://www.crazygames.com'},
{n:'Tech',e:'🔧',pay:'https://exe.io/vpj6tr',site:'https://www.goafricaonline.com/cm/annuaire/techniciens'},
{n:'Livraison',e:'🛵',pay:'https://shrinkme.click/kamchat-hotel-final',site:'https://glovoapp.com/cm/fr/yaounde/'},
{n:'Forma',e:'🎓',pay:'https://srnky.com/FJi7r05baJ8',site:'https://www.coursera.org'},
{n:'Logement',e:'🏠',pay:'https://clksz.com/mxrfAbm',site:'https://www.airbnb.com/s/Yaounde/homes'},
{n:'Waspito',e:'🩺',pay:'https://shrinkme.click/kamchat-hotel-test',site:'https://waspito.com'},
];
const grid=document.getElementById('grid');
cats.forEach(c=>{
  let d=document.createElement('div'); d.className='bg-white rounded-2xl py-6 text-center shadow-sm border cursor-pointer';
  d.innerHTML=`<div class="text-[34px]">${c.e}</div><p class="font-bold text-[11px] mt-1">${c.n}</p>`;
  if(c.type==='tab'){ d.onclick=()=>showTab(c.tab); } else { d.onclick=()=>openPub(c.pay, c.site, c.n); }
  grid.appendChild(d);
});
function openPub(pay, site, name){
  window.open(pay,'_blank'); // TON LIEN REDUIT QUI PAIE
  let pub=document.getElementById('pub'); pub.classList.remove('hidden'); pub.classList.add('flex');
  let s=10; let btn=document.getElementById('btntxt'); let go=document.getElementById('go');
  btn.classList.remove('hidden'); go.classList.add('hidden');
  let t=setInterval(()=>{ s--; document.getElementById('num').innerText=s>0?s:'✓'; btn.innerText=`Bouton dans ${s}s...`; if(s<=0){ clearInterval(t); btn.classList.add('hidden'); go.classList.remove('hidden'); go.innerText=`👉 ALLER VERS ${name.toUpperCase()}`; go.onclick=()=>{ window.open(site,'_blank'); closePub(); } } },1000);
}
function closePub(){ document.getElementById('pub').classList.add('hidden'); document.getElementById('pub').classList.remove('flex'); }
function showTab(t){ document.getElementById('tab-home').classList.add('hidden'); document.getElementById('tab-chat').classList.add('hidden'); document.getElementById('tab-moments').classList.add('hidden'); document.getElementById('tab-'+t).classList.remove('hidden'); if(t==='home') document.getElementById('tab-home').classList.remove('hidden'); }
function send(){ let i=document.getElementById('inp'); if(!i.value) return; let m=document.createElement('div'); m.className='bg-[#00c853] text-white rounded-xl px-3 py-2 text-sm w-fit ml-auto'; m.innerText=i.value; document.getElementById('msgs').appendChild(m); i.value=''; }
</script></body></html>
