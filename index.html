<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMCHAT 🇨🇲</title>
<style>
body{margin:0;font-family:system-ui;background:#f5f5f5}
.top{background:#00b050;color:white;display:flex;justify-content:space-between;padding:12px 14px;position:sticky;top:0;z-index:10}
.badge{background:white;color:#00b050;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800}
.animBox{background:white;margin:12px;border-radius:20px;overflow:hidden;box-shadow:0 2px 8px #0002;cursor:pointer;border:3px solid transparent}
.animBox:active{transform:scale(0.96);border-color:#00b050}
.dash{background:black;color:white;border-radius:20px;padding:14px;margin:12px}
.gridV{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#pubPage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;text-align:center;padding:12px;box-sizing:border-box}
</style>
</head>
<body>

<div class="top"><b>KAMCHAT 🇨🇲</b><span class="badge">19 pubs = 19 paiements</span></div>

<!-- 1. ANIMATION 12 SERVICES QUI REMPLACE CHAT ET CONSORTS -->
<div style="padding:12px 12px 0">
<h3 style="margin:0">Yaoundé Services App (clique = PAYÉ 💰)</h3>
</div>
<div class="animBox" onclick="go('hotel')">
<img src="https://i.ibb.co/2YcG7yQg/yaounde-12.jpg" style="width:100%;display:block" onerror="this.src='https://via.placeholder.com/400x400?text=Yaounde+12+Services'">
<div style="padding:10px;text-align:center;font-weight:800;color:#00b050">👆 CLIQUE ICI = 5s PUB + PAIEMENT</div>
</div>

<!-- 2. DASHBOARD AVEC 6 VIDEOS FACEBOOK A LA PLACE DU BONHOMME -->
<div class="dash">
<div style="display:flex;justify-content:space-between"><b>📊 DASHBOARD</b><span style="background:#222;padding:3px 8px;border-radius:10px;font-size:10px">6 pubs = 6 paiements</span></div>
<small style="color:#aaa">Tes vidéos Facebook qui te paient</small>
<div class="gridV">
<iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1851246792913670/&show_text=false" style="width:100%;height:170px;border:none;border-radius:12px"></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1569449071110431/&show_text=false" style="width:100%;height:170px;border:none;border-radius:12px"></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1404166711249147/&show_text=false" style="width:100%;height:170px;border:none;border-radius:12px"></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1818182712682361/&show_text=false" style="width:100%;height:170px;border:none;border-radius:12px"></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/2600188100430700/&show_text=false" style="width:100%;height:170px;border:none;border-radius:12px"></iframe>
<iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/2014627569309082/&show_text=false" style="width:100%;height:170px;border:none;border-radius:12px"></iframe>
</div>
</div>

<!-- PAGE PUB 5s -->
<div id="pubPage">
<h2 style="color:#00b050">KAMCHAT</h2>
<p id="sName" style="font-weight:bold"></p>
<h1 id="count" style="font-size:60px;color:#00b050;margin:10px">5</h1>
<iframe id="vPub" src="" style="width:100%;height:400px;border:none;border-radius:15px"></iframe>
<p style="font-size:12px;color:#666">Après 5s → cuty.io (5s) → Booking.com</p>
</div>

<script>
const VIDEOS=[
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1851246792913670/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1569449071110431/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1404166711249147/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1818182712682361/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/2600188100430700/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/2014627569309082/&show_text=false"
];
const PAY={hotel:"https://cuty.io/DP9Nefl",resto:"https://exe.io/8LSKy",default:"https://cuty.io/DP9Nefl"};
let idx=0;
function go(t){
document.getElementById('pubPage').style.display='block';
document.getElementById('sName').innerText=t+" - Hotel Booking";
document.getElementById('vPub').src=VIDEOS[idx%6];idx++;
let s=5;
let tm=setInterval(()=>{s--;document.getElementById('count').innerText=s;if(s<=0){clearInterval(tm);location.href=PAY[t]||PAY.default;}},1000);
}
</script>
</body>
  </html>
