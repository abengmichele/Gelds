<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAMCHAT</title>
<style>
body{font-family:Arial;margin:0;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:15px}
.card{background:#f8f9fa;border-radius:20px;padding:18px;text-align:center;color:#333;cursor:pointer;transition:0.2s;user-select:none}
.icon{font-size:34px}
/* OPTION 3 - REBOND INTERACTIF */
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.25) rotate(2deg); }
  100% { transform: scale(1); }
}
.card:active {
  animation: pop 0.4s ease;
  background:#d4edda!important;
}
#pubPage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:999;text-align:center;padding:15px;box-sizing:border-box;overflow-y:auto}
.video-header{width:100%;border-radius:20px;display:block}
</style>
</head>
<body>

<div id="main">
<!-- OPTION 1 - VIDEO LEGERE EN HAUT (tes 12 qui respirent) -->
<!-- Pour Vercel: upload ta video 962bad77.mp4 dans ton projet et mets src="generated_video_962bad77.mp4" -->
<video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay muted loop playsinline class="video-header" id="headerVideo"></video>
<p style="text-align:center;color:green;font-weight:bold;margin:5px">🇨🇲 KAMCHAT - Yaoundé Services</p>

<div class="grid">
<div class="card" onclick="showPub('hotel')"><div class="icon">🏨</div>Hotel</div>
<div class="card" onclick="showPub('resto')"><div class="icon">🍽️</div>Restaurant</div>
<div class="card" onclick="showPub('car')"><div class="icon">🚗</div>Car rental</div>
</div>
</div>

<!-- PAGE PUB 5s AVEC VIDEO FACEBOOK STATIQUE -->
<div id="pubPage">
<h2 style="color:green;margin:0">KAMCHAT</h2>
<p>Chargement <b id="siteName"></b>... <b id="count" style="color:green;font-size:32px">5</b></p>
<div style="margin:10px 0">
<iframe id="videoPub" src="" style="width:100%;height:450px;border:none;border-radius:15px" allowfullscreen></iframe>
</div>
<p style="color:#999;font-size:12px">Pub → redirection auto</p>
</div>

<script>
// TES 6 VIDEOS FACEBOOK STATIQUES
const VIDEOS = [
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1851246792913670/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1569449071110431/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1404166711249147/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1818182712682361/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/2600188100430700/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/2014627569309082/&show_text=false"
];

// TES 3 LIENS RACCOURCIS QUI TE PAIENT (j'ai choisi 1 par 1 comme tu voulais)
const PAY_LINKS = {
  hotel: "https://cuty.io/DP9Nefl",
  resto: "https://exe.io/8LSKy",
  car: "https://clksz.com/mxrfAbm"
};

let videoIndex = 0;

function showPub(type){
  document.getElementById('main').style.display='none';
  document.getElementById('pubPage').style.display='block';
  document.getElementById('siteName').innerText=type;
  // Video Facebook statique qui change à chaque clic (1 après l'autre)
  document.getElementById('videoPub').src = VIDEOS[videoIndex % VIDEOS.length];
  videoIndex++;
  let s=5;
  document.getElementById('count').innerText=s;
  let timer=setInterval(()=>{
    s--;
    document.getElementById('count').innerText=s;
    if(s<=0){
      clearInterval(timer);
      window.location.href = PAY_LINKS[type];
    }
  },1000);
}
</script>

</body>
</html>
