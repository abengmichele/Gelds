<!-- OVERLAY PUB 10s -->
<div id="pub" class="hidden fixed inset-0 bg-black/95 z-50 max-w-[430px] mx-auto flex-col items-center justify-center p-6 text-center">
<p class="text-white/60 text-xs">Pub ouverte - 0.05$</p><p id="num" class="text-white text-7xl font-black">10</p>

</div></div>

</div>
<script>
const SMART="https://www.profitableratecpmnetwork.com/m2i2tbjurk?key=6fc0d706ffa8c33078c6eb7f2a983b6d";
const cats=[
{n:'Hotel',e:'🏨',pay:'https://shrinkme.click/kamchat-hotel-final',site:'https://www.booking.com/city/cm/yaounde.html'},
{n:'Resto',e:'🍔',pay:'https://shrinkme.click/Cpnr',site:'https://glovoapp.com/cm/fr/yaounde/'},
{n:'Pharma',e:'💊',pay:'https://srnky.com/FJi7r05baJ8',site:'https://waspito.com'},
{n:'MyJob',e:'💼',pay:'https://clksz.com/mxrfAbm',site:'https://www.myjobmag.cm'},
{n:'Emploi',e:'📋',pay:'https://clksz.com/Fme4',site:'https://www.emploi.cm'},
{n:'Car',e:'🚗',pay:'https://exe.io/8LSKy',site:'https://www.rentalcars.com/en/city/cm/yaounde/'},
{n:'Jeux',e:'🎮',pay:'https://clksz.com/5FLBwBQXy5',site:'https://www.crazygames.com'},
{n:'Tech',e:'🔧',pay:'https://exe.io/vpj6tr',site:'https://www.goafricaonline.com/cm/annuaire/techniciens'},
{n:'Livraison',e:'🛵',pay:'https://shrinkme.click/kamchat-hotel-final',site:'https://glovoapp.com/cm/fr/yaounde/'},
{n:'Forma',e:'🎓',pay:'https://srnky.com/FJi7r05baJ8',site:'https://www.coursera.org'},
{n:'Logement',e:'🏠',pay:'https://clksz.com/mxrfAbm',site:'https://www.airbnb.com/s/Yaounde/homes'},
{n:'Waspito',e:'🩺',pay:'https://shrinkme.click/kamchat-hotel-test',site:'https://waspito.com'},
];
const grid=document.getElementById('grid');
cats.forEach(c=>{
  let d=document.createElement('div'); d.className='bg-white rounded-2xl py-5 text-center shadow-sm border cursor-pointer';
  d.innerHTML=`<div class="text-3xl">${c.e}</div><p class="font-bold text-[11px] mt-1">${c.n}</p>`;
  d.onclick=()=>openPub(c.pay, c.site, c.n); grid.appendChild(d);
});
function openPub(pay, site, name){
  window.open(pay,'_blank');
  let pub=document.getElementById('pub'); pub.classList.remove('hidden'); pub.classList.add('flex');
  let s=10; let btn=document.getElementById('btntxt'); let go=document.getElementById('go');
  btn.classList.remove('hidden'); go.classList.add('hidden');
  let t=setInterval(()=>{ s--; document.getElementById('num').innerText=s>0?s:'✓'; btn.innerText=`Bouton dans ${s}s...`; if(s<=0){ clearInterval(t); btn.classList.add('hidden'); go.classList.remove('hidden'); go.innerText=`👉 ALLER VERS ${name}`; go.onclick=()=>{ window.open(site,'_blank'); closePub(); } } },1000);
}
function openMonetag(){ window.open(SMART,'_blank'); alert("Merci! 0.05$ gagné"); }
function closePub(){ document.getElementById('pub').classList.add('hidden'); document.getElementById('pub').classList.remove('flex'); }
function showTab(t){ document.getElementById('tab-home').classList.add('hidden'); document.getElementById('tab-chat').classList.add('hidden'); document.getElementById('tab-moments').classList.add('hidden'); document.getElementById('tab-'+t).classList.remove('hidden'); }
function send(){ let i=document.getElementById('inp'); if(!i.value) return; let m=document.createElement('div'); m.className='bg-[#00c853] text-white rounded-xl px-3 py-2 text-sm w-fit ml-auto'; m.innerText=i.value; document.getElementById('msgs').appendChild(m); i.value=''; }
// PUB AUTO AU DEBUT + TOUTES LES 5 MIN
setTimeout(openMonetag, 2000);
setInterval(openMonetag, 300000);
</script></body></html>
