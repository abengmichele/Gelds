<div id="pub" class="fixed inset-0 bg-black/95 z-[999] hidden flex-col items-center justify-center p-6 text-center text-white">

<button id="goBtn" class="bg-green-600 text-white px-8 py-4 rounded-full font-black mt-4 hidden">👉 ALLER VERS LE SITE</button>

</div>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 text-[11px] font-bold">
<div class="text-green-600">🏠<br>Accueil</div><div class="text-gray-400">👥<br>Contacts</div><div class="text-gray-400">🧭<br>Découvrir</div><div class="text-green-600">👤<br>Moi - <span id="dGain3">0F</span></div>
</div>

<script>
let vues=parseInt(localStorage.getItem('vues')||0)
let temps=parseInt(localStorage.getItem('temps')||0)
let lienEnCours=""
function refresh(){
 document.getElementById('vues').innerText=vues
 document.getElementById('temps').innerText=temps+'s'
 document.getElementById('gain').innerText=(temps*10)+' FCFA'
 document.getElementById('dGain2').innerText=(temps*10)+' FCFA'
 document.getElementById('dGain3').innerText=(temps*10)+'F'
}
refresh()
function openSite(url,nom){
 lienEnCours=url
 document.getElementById('pubTitle').innerText=nom+" - PUB 5s"
 document.getElementById('pub').style.display='flex'
 document.getElementById('goBtn').style.display='none'
 let c=5
 document.getElementById('count').innerText=c
 let t=setInterval(()=>{
  c--;document.getElementById('count').innerText=c
  if(c<=0){
   clearInterval(t)
   document.getElementById('count').innerText="OK!"
   let btn=document.getElementById('goBtn')
   btn.style.display='block'
   btn.onclick=()=>{
    vues++;temps+=5
    localStorage.setItem('vues',vues);localStorage.setItem('temps',temps)
    refresh()
    window.open(lienEnCours,'_blank')
    document.getElementById('pub').style.display='none'
   }
  }
 },1000)
}
</script>
