<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAMCHAT - Yaounde</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
.top{background:#00b050;color:white;display:flex;justify-content:space-between;padding:12px 14px}
.badge{background:white;color:#00b050;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:12px}
.card{background:white;border-radius:14px;padding:10px 2px;text-align:center;box-shadow:0 1px 3px #0001;cursor:pointer;border:2px solid transparent}
.card:active{animation:pop.4s ease;background:#d4edda;border-color:#00b050;transform:scale(1.08)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.paye{color:#00b050;font-size:9px;font-weight:800}
#pub{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:999;text-align:center;padding:12px;box-sizing:border-box}
</style>
</head>
<body>

<div class="top"><b>KAMCHAT 🇨🇲</b><span class="badge">19 pubs = 19 paiements</span></div>

<h3 style="padding:0 12px;margin:12px 0 0">Services (clique = tu es payé 💰)</h3>
<div class="grid">
<div class="card" onclick="go('hotel')">🏨<br><small>Hotel</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('resto')">🍲<br><small>Resto</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('pharma')">💊<br><small>Pharma</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('fne')">🏢<br><small>FNE</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('waspito')">👩‍⚕️<br><small>Waspito</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('emploi')">📄<br><small>Emploi</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('car')">🚗<br><small>Car</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('jeux')">🎮<br><small>Jeux</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('tech')">💻<br><small>Tech</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('livraison')">🛵<br><small>Livraison</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('formation')">📚<br><small>Formation</small><br><span class="paye">PAYÉ</span></div>
<div class="card" onclick="go('logement')">🏠<br><small>Logement</small><br><span class="paye">PAYÉ</span></div>
</div>

<div id="pub">
<h2 style="color:#00b050">KAMCHAT</h2>
<p id="sName"></p>
<h1 style="color:#00b050;font-size:48px" id="count">5</h1>
<iframe id="vPub" src="" style="width:100%;height:400px;border:none;border-radius:15px"></iframe>
</div>

<script>
const V=[
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1851246792913670/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1569449071110431/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1404166711249147/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/1818182712682361/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/2600188100430700/&show_text=false",
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/reel/2014627569309082/&show_text=false"
];
const P={
hotel:"https://cuty.io/DP9Nefl",
resto:"https://exe.io/8LSKy",
pharma:"https://clksz.com/mxrfAbm",
fne:"https://linkjust.com/KUg467",
waspito:"https://cuty.io/1wu6Yi1",
emploi:"https://linkjust.com/s3e6wt7a9a",
car:"https://cuty.io/DP9Nefl",
jeux:"https://exe.io/8LSKy",
tech:"https://clksz.com/mxrfAbm",
livraison:"https://linkjust.com/KUg467",
formation:"https://cuty.io/1wu6Yi1",
logement:"https://linkjust.com/s3e6wt7a9a"
};
let i=0;
function go(t){
document.getElementById('pub').style.display='block';
document.getElementById('sName').innerText=t;
document.getElementById('vPub').src=V[i%6];i++;
let s=5;
let x=setInterval(()=>{s--;document.getElementById('count').innerText=s;if(s<=0){clearInterval(x);location.href=P[t];}},1000);
}
</script>
</body>
</html>
