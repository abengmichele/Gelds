function openSite(shortLink, realUrl, name){
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal-name').innerText=name;
  document.getElementById('modal-real').innerText=realUrl;
  document.getElementById('modal-link').href=shortLink;
  document.getElementById('modal-iframe').src=realUrl;
  let s=5; let t=setInterval(()=>{
    s--; document.getElementById('count').innerText=s;
    if(s<=0){clearInterval(t); document.getElementById('count').innerText="OK"; }
  },1000);
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
</script>
